version: '3.8'

services:
  power-analysis-tool:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: power-analysis-tool
    ports:
      - "3838:3838"
    environment:
      - GOLEM_APP_PROD=TRUE
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3838/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
